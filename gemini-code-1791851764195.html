<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Square!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1e1e2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        #game-board {
            width: 400px;
            height: 400px;
            border: 3px solid #89b4fa;
            position: relative;
            margin: 20px auto;
            background-color: #181825;
            overflow: hidden;
            border-radius: 10px;
        }
        #target {
            width: 50px;
            height: 50px;
            background-color: #f38ba8;
            position: absolute;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #a6e3a1;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #94e2d5;
        }
    </style>
</head>
<body>

    <h1>Catch the Square! 🎯</h1>
    <p>Click the square as many times as you can before the time runs out!</p>
    
    <h3>Score: <span id="score">0</span> | Time Left: <span id="time">10</span>s</h3>
    
    <div id="game-board">
        <div id="target" style="display: none;"></div>
    </div>

    <button id="start-btn" onclick="startGame()">Start Game</button>

    <script>
        let score = 0;
        let timeLeft = 10;
        let timer;
        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        const board = document.getElementById('game-board');

        function moveTarget() {
            const maxX = board.clientWidth - 50;
            const maxY = board.clientHeight - 50;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
        }

        target.addEventListener('click', () => {
            score++;
            scoreDisplay.textContent = score;
            moveTarget();
        });

        function startGame() {
            score = 0;
            timeLeft = 10;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            startBtn.style.display = 'none';
            target.style.display = 'block';

            moveTarget();

            timer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    target.style.display = 'none';
                    startBtn.style.display = 'inline-block';
                    startBtn.textContent = 'Play Again';
                    alert('Game Over! Your final score is: ' + score);
                }
            }, 1000);
        }
    </script>
</body>
</html>
